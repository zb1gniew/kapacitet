services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: kapacitetdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Tell Keycloak its public-facing URL so OIDC tokens have the correct issuer.
      # DEV: https://auth.localhost  |  PROD: https://auth.yourdomain.com
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-https://auth.localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    # Keycloak is no longer exposed directly to the host.
    # Traffic reaches it only through the Caddy proxy.
    expose:
      - "8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/kapacitet-realm.json:/opt/keycloak/data/import/kapacitet-realm.json:ro

  backend:
    build: ../backend
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=kapacitetdb;Username=appuser;Password=strongpassword
      # Backend validates JWT tokens against Keycloak's public URL (authority).
      # DEV: https://auth.localhost/realms/kapacitet  |  PROD: https://auth.yourdomain.com/realms/kapacitet
      Keycloak__Authority: ${KEYCLOAK_PUBLIC_URL:-https://auth.localhost}/realms/kapacitet
      # Server-to-server metadata fetch uses the internal Docker network — no HTTPS needed here.
      Keycloak__MetadataAddress: http://keycloak:8080/realms/kapacitet/.well-known/openid-configuration
      Keycloak__ClientId: kapacitet-app
      KeycloakAdmin__BaseUrl: http://keycloak:8080
      Email__ApiKey: ${Email__ApiKey:-}
      Email__FromAddress: ${Email__FromAddress:-onboarding@resend.dev}
      Email__DevMode: ${Email__DevMode:-true}
    # Backend is internal-only. Never exposed to the internet.
    expose:
      - "8080"
    depends_on:
      - postgres
      - keycloak

  frontend:
    build: ../frontend
    environment:
      # Internal Docker network call — stays HTTP.
      BACKEND_API_URL: http://backend:8080
      # Browser-facing OIDC URL — must match Keycloak's public HTTPS URL.
      # DEV: https://auth.localhost/realms/kapacitet  |  PROD: https://auth.yourdomain.com/realms/kapacitet
      OIDC_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL:-https://auth.localhost}/realms/kapacitet
      # Server-side token validation uses the internal Docker network.
      OIDC_SERVER_ISSUER_URL: http://keycloak:8080/realms/kapacitet
      OIDC_CLIENT_ID: kapacitet-app
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: openid profile email offline_access
      # true because Caddy serves the app over HTTPS — cookies must be Secure-flagged.
      AUTH_COOKIE_SECURE: "true"
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
    # Frontend is reached through Caddy only.
    expose:
      - "3000"
    depends_on:
      - backend

  # -----------------------------------------------------------
  # Caddy — Reverse proxy and TLS termination
  #
  # DEV:  Uses local_certs (automatic trusted local CA).
  #       First-time setup: docker exec caddy caddy trust
  #       Then restart your browser.
  #
  # PROD: Replace domain names in Caddyfile with your real domains.
  #       Caddy obtains and renews Let's Encrypt certificates automatically.
  #       Requires ports 80+443 open and DNS A records pointing to this server.
  # -----------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP → redirected to HTTPS automatically by Caddy
      - "443:443"     # HTTPS (TLS 1.3 by default)
      - "443:443/udp" # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persists TLS certificates across restarts
      - caddy_config:/config  # Caddy config cache
    depends_on:
      - frontend
      - keycloak

volumes:
  postgres_data:
  keycloak_data:
  caddy_data:
  caddy_config:
