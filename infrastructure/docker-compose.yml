services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: kapacitetdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/kapacitet-realm.json:/opt/keycloak/data/import/kapacitet-realm.json:ro

  backend:
    build: ../backend
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=kapacitetdb;Username=appuser;Password=strongpassword
      Keycloak__Authority: http://localhost:8080/realms/kapacitet
      Keycloak__MetadataAddress: http://host.docker.internal:8080/realms/kapacitet/.well-known/openid-configuration
      Keycloak__ClientId: kapacitet-app
      KeycloakAdmin__BaseUrl: http://host.docker.internal:8080
      Email__ApiKey: ${Email__ApiKey:-}
      Email__FromAddress: ${Email__FromAddress:-onboarding@resend.dev}
      Email__DevMode: ${Email__DevMode:-true}
    ports:
      - "5051:8080"
    depends_on:
      - postgres
      - keycloak

  frontend:
    build: ../frontend
    environment:
      BACKEND_API_URL: http://backend:8080
      OIDC_ISSUER_URL: http://localhost:8080/realms/kapacitet
      OIDC_SERVER_ISSUER_URL: http://host.docker.internal:8080/realms/kapacitet
      OIDC_CLIENT_ID: kapacitet-app
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: openid profile email offline_access
      AUTH_COOKIE_SECURE: "false"
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  keycloak_data:
